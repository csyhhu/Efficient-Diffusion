# DiT (Diffusion Transformer) model config for CIFAR100 + Flow Matching
# Maps directly to DiT.__init__() kwargs

# Input - CIFAR100 is 32x32 RGB, using native resolution
# VAE with 8x downsample: 32/8 = 4, so latent size is 4x4
in_channels: 4           # VAE latent channels
image_size: 4            # latent size (32/8)
patch_size: 2            # 4/2 = 2 → 4 tokens

# Transformer architecture
hidden_dim: 256          # hidden dimension of transformer
depth: 1                 # number of DiT blocks
num_heads: 4             # attention heads (must divide hidden_dim)
time_dim: 256            # time embedding dimension
mlp_ratio: 4.0           # MLP hidden / transformer hidden ratio

# Text conditioning
use_cross_attention: true
cross_attention_dim: 768

# Rotation and permutation for quantization
rotation: None
permutation: None

# Pipeline components (download via ModelScope)
# Using iic/multi-modal_clip-vit-base-patch16_zh which is a Chinese CLIP model
# It uses BERT-style tokenizer (vocab.txt)
vae: "stabilityai/sd-vae-ft-mse"
tokenizer: "iic/multi-modal_clip-vit-base-patch16_zh"
text_encoder: "iic/multi-modal_clip-vit-base-patch16_zh"

# Download settings
download_source: "modelscope"
cache_dir: "G://models"