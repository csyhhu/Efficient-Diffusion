# Running / Training config for MNIST + DiT + Flow Matching
# Referenced by main.py training loop

# ── Scheduler ──
sample_type: "fm"         # "ddpm" | "fm" → triggers fm_sample (no VAE → MNIST)
num_timesteps: 1000       # total timesteps for Flow Matching

# ── Training ──
lr: 0.0001                # learning rate (Adam)
epochs: 1               # number of training epochs

# ── Sampling ──
sample_interval: 1        # sample interval (epochs)
num_steps: 50             # ODE discretization steps for FM sampling
